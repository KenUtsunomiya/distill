<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>distill</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <h1 class="brand">distill</h1>
        <nav class="tabs" role="tablist">
          <button role="tab" data-view="today" aria-selected="true">今日<span class="count"></span></button>
          <button role="tab" data-view="toread" aria-selected="false">読みたい<span class="count"></span></button>
          <button role="tab" data-view="done" aria-selected="false">読んだ<span class="count"></span></button>
        </nav>
      </div>
    </header>

    <main class="page">
      <p class="lead" id="lead"></p>
      <div class="filters" id="filters" hidden></div>
      <div id="list" aria-live="polite"></div>
    </main>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" type="button">元に戻す</button>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
