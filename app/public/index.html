<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5bb8dc" />
    <title>distill</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand-row">
          <h1 class="brand">distill</h1>
          <div class="who" id="who" hidden>
            <span id="who-login"></span>
            <button type="button" id="logout">ログアウト</button>
          </div>
        </div>
        <nav class="tabs" role="tablist" id="tabs" hidden>
          <button role="tab" data-view="today" aria-selected="true">新着<span class="count"></span></button>
          <button role="tab" data-view="toread" aria-selected="false" aria-label="読みたい" title="読みたい"><svg class="tab-icon heart-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2C1 8.2 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.7 0 5.6 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z" /></svg><span class="count"></span></button>
          <button role="tab" data-view="done" aria-selected="false" aria-label="読んだ" title="読んだ"><svg class="tab-icon check-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" class="ring" /><path d="M8 12.4l2.7 2.7L16.2 9.4" class="tick" /></svg><span class="count"></span></button>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="signin" id="signin" hidden>
        <p>記事を読むには、GitHub でログインしてください。</p>
        <a class="btn primary" href="/auth/login">GitHub でログイン</a>
      </section>
      <p class="lead" id="lead"></p>
      <div class="filters" id="filters" hidden></div>
      <div id="list" aria-live="polite"></div>
    </main>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" type="button">元に戻す</button>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
